<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>WinGo Prediction Tool</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Segoe UI',sans-serif;background:#080814}
#frame{position:fixed;inset:0;width:100%;height:100%;border:none;z-index:1}

/* ════ CARD ════ */
#card{position:fixed;bottom:16px;right:14px;width:310px;background:#0d0d24;border:1px solid rgba(139,92,246,.5);border-radius:18px;box-shadow:0 8px 50px rgba(109,40,217,.55);z-index:2147483647;overflow:hidden;pointer-events:all!important}
#card.mini{width:54px;height:54px;border-radius:50%;cursor:pointer}
#card.mini #body{display:none}
#card.mini #mico{display:flex}
#mico{display:none;width:54px;height:54px;align-items:center;justify-content:center;font-size:22px;pointer-events:none}
.dbar{width:38px;height:4px;background:#252550;border-radius:2px;margin:11px auto 9px}
#body{padding:0 14px 13px}
.hrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.badge{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:1.3px;color:#8b5cf6}
.dot{width:8px;height:8px;border-radius:50%;background:#8b5cf6;flex-shrink:0;animation:pulse 1.4s infinite}
.dot.g{background:#22c55e;animation:none}.dot.y{background:#facc15;animation:none}.dot.r{background:#ef4444;animation:none}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.55);opacity:.4}}
.minbtn{background:#1a1a38;border:none;color:#44447a;font-size:17px;width:25px;height:25px;border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.minbtn:hover{background:#2a2a50;color:#8b5cf6}
#msg{font-size:15px;font-weight:700;color:#e8e8ff;line-height:1.4;margin-bottom:3px}
#sub{font-size:11px;color:#44447a;line-height:1.4}

/* ── progress bar ── */
#progBar{display:none;margin-top:10px}
.pg-lbl{display:flex;justify-content:space-between;font-size:10px;color:#44447a;margin-bottom:4px}
.pg-track{height:4px;background:#12122a;border-radius:99px;overflow:hidden}
.pg-fill{height:100%;background:linear-gradient(90deg,#6d28d9,#a78bfa);border-radius:99px;transition:width .4s ease;width:0}

/* ── nav buttons ── */
.navrow{display:flex;gap:6px;margin-top:10px}
.nbtn{flex:1;padding:7px 3px;font-size:11px;font-weight:700;border-radius:9px;border:1px solid #1e1e40;background:#14143a;cursor:pointer;text-align:center;transition:all .15s;pointer-events:all!important;-webkit-tap-highlight-color:rgba(139,92,246,.3)}
.nbtn:active{transform:translateY(1px)}
#nb1{color:#818cf8}#nb2{color:#34d399}#nb3{color:#facc15;border-color:#2a2a10;background:#1a1a0a}

/* ── entry panel ── */
#entryPanel{display:none;margin-top:11px;padding-top:11px;border-top:1px solid #1a1a38}
.ent-title{font-size:11px;font-weight:800;color:#a78bfa;text-transform:uppercase;letter-spacing:1.2px;margin-bottom:10px;text-align:center}
.id-row{display:flex;align-items:center;gap:7px;margin-bottom:10px}
.id-row label{font-size:10px;color:#44447a;text-transform:uppercase;white-space:nowrap;letter-spacing:.6px}
.id-row input{flex:1;padding:8px 10px;background:#080818;border:1px solid #252545;border-radius:9px;color:#e0e0f0;font-size:13px;outline:none}
.id-row input:focus{border-color:#8b5cf6}
.gl{font-size:10px;color:#44447a;text-transform:uppercase;letter-spacing:.7px;margin-bottom:6px}
.bg{display:flex;gap:5px;margin-bottom:10px;flex-wrap:wrap}
.ob{flex:1;min-width:60px;padding:8px 4px;border-radius:10px;border:2px solid transparent;font-size:12px;font-weight:700;cursor:pointer;text-align:center;transition:all .18s;pointer-events:all!important}

/* number 0-9 grid */
.ng{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-bottom:10px}
.nmb{padding:8px;border-radius:8px;border:1px solid #252545;background:#0d0d24;color:#555580;font-size:13px;font-weight:800;cursor:pointer;text-align:center;transition:all .15s;pointer-events:all!important}
.nmb.sel{background:#6d28d9;border-color:#a78bfa;color:#fff;box-shadow:0 0 10px rgba(109,40,217,.5)}

/* size */
.s-big{background:#0a1e3a;color:#93c5fd;border-color:#1e3a5a}.s-big.sel{background:#1e3a5f;border-color:#3b82f6;box-shadow:0 0 8px rgba(59,130,246,.5)}
.s-sml{background:#181820;color:#d1d5db;border-color:#2a2a3a}.s-sml.sel{background:#1f2937;border-color:#6b7280;box-shadow:0 0 8px rgba(107,114,128,.4)}

/* colour */
.c-r{background:#2d0808;color:#fca5a5;border-color:#4a0f0f}.c-r.sel{background:#7f1d1d;border-color:#ef4444;box-shadow:0 0 10px rgba(239,68,68,.5)}
.c-g{background:#052810;color:#86efac;border-color:#0a3a18}.c-g.sel{background:#14532d;border-color:#22c55e;box-shadow:0 0 10px rgba(34,197,94,.5)}
.c-v{background:#1a0545;color:#d8b4fe;border-color:#2d0a60}.c-v.sel{background:#3b0764;border-color:#a855f7;box-shadow:0 0 10px rgba(168,85,247,.5)}
.c-rp{background:#2d0820;color:#f9a8d4;border-color:#4a0f2a}.c-rp.sel{background:#6b1a3a;border-color:#ec4899;box-shadow:0 0 10px rgba(236,72,153,.5)}
.c-gp{background:#0a2818;color:#6ee7b7;border-color:#0a3a20}.c-gp.sel{background:#065f46;border-color:#10b981;box-shadow:0 0 10px rgba(16,185,129,.5)}

/* save btn */
.bsave{width:100%;padding:11px;background:linear-gradient(135deg,#6d28d9,#a78bfa);border:none;border-radius:12px;color:#fff;font-size:14px;font-weight:800;cursor:pointer;transition:transform .15s,box-shadow .2s;margin-top:3px}
.bsave:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(109,40,217,.55)}
.bsave:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}

/* saved mini list */
#savedList{margin-top:9px;max-height:115px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#252545 transparent}
.sv{display:grid;grid-template-columns:18px 22px 1fr 1fr 20px;gap:5px;align-items:center;padding:5px 6px;background:#0d0d24;border-radius:7px;margin-bottom:3px;font-size:10px}
.sv-i{color:#333;font-weight:700;text-align:center}.sv-pid{color:#44447a;font-family:monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sv-n{width:20px;height:20px;background:#252545;border-radius:5px;font-size:11px;font-weight:800;color:#a78bfa;text-align:center;line-height:20px}
.sv-c,.sv-s{padding:2px 5px;border-radius:8px;font-size:10px;font-weight:700;text-align:center}
.sv-del{background:none;border:none;color:#252545;cursor:pointer;font-size:14px;padding:0;pointer-events:all!important}
.sv-del:hover{color:#ef4444}

/* result */
#resultArea{display:none;margin-top:11px;padding-top:11px;border-top:1px solid #1a1a38;animation:fup .4s ease}
@keyframes fup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.rnext{text-align:center;font-size:10px;color:#44447a;text-transform:uppercase;letter-spacing:1px;margin-bottom:7px}
.rnum{font-size:62px;font-weight:900;line-height:1;text-align:center;margin-bottom:11px;background:linear-gradient(135deg,#a78bfa,#6d28d9);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.rrow{display:flex;gap:7px;justify-content:center;margin-bottom:9px;flex-wrap:wrap}
.rbadge{padding:5px 14px;border-radius:20px;font-size:12px;font-weight:800}
.rb-r{background:#7f1d1d;color:#fca5a5;border:1px solid rgba(239,68,68,.3)}
.rb-g{background:#14532d;color:#86efac;border:1px solid rgba(34,197,94,.3)}
.rb-v{background:#3b0764;color:#d8b4fe;border:1px solid rgba(168,85,247,.3)}
.rb-big{background:#1e3a5f;color:#93c5fd;border:1px solid rgba(59,130,246,.3)}
.rb-sml{background:#1f2937;color:#d1d5db;border:1px solid rgba(107,114,128,.3)}
.rb-pid{background:#0d0d24;color:#c4b5fd;border:1px solid #252545;font-family:monospace;font-size:11px}
.cconf{margin-top:7px}
.ccrow{display:flex;justify-content:space-between;font-size:11px;margin-bottom:4px}
.cclbl{color:#44447a;text-transform:uppercase;letter-spacing:.7px}.ccpct{color:#8b5cf6;font-weight:800}
.ctrack{height:5px;border-radius:99px;background:#0a0a18;overflow:hidden}
.cfill{height:100%;border-radius:99px;background:linear-gradient(90deg,#6d28d9,#a78bfa);width:0;transition:width 1.1s ease}
.bagain{width:100%;padding:10px;background:#14143a;border:1px solid #252545;border-radius:11px;color:#a78bfa;font-size:13px;font-weight:700;cursor:pointer;margin-top:9px;pointer-events:all!important}
.bagain:hover{background:#1e1e50}

.ldots span{display:inline-block;width:6px;height:6px;background:#8b5cf6;border-radius:50%;margin:0 2px;animation:lb .75s infinite}
.ldots span:nth-child(2){animation-delay:.14s}.ldots span:nth-child(3){animation-delay:.28s}
@keyframes lb{0%,80%,100%{transform:scale(1)}40%{transform:scale(1.7)}}
</style>
</head>
<body>
<iframe id="frame" src="https://yaarwin.app/#/login" allow="*"
  sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-top-navigation allow-modals"></iframe>

<div id="card" onclick="if(window.isMini){window.isMini=false;document.getElementById('card').classList.remove('mini')}"
  <span id="mico">🎯</span>
  <div class="dbar"></div>
  <div id="body">
    <div class="hrow">
      <div class="badge"><div class="dot" id="dot"></div><span id="badge">Prediction Tool</span></div>
      <button class="minbtn" onclick="doMin();return false;">−</button>
    </div>
    <div id="msg">Login Now To Start</div>
    <div id="sub">Log in to yaarwin.app, then tap 🎮 WinGo</div>

    <!-- progress -->
    <div id="progBar">
      <div class="pg-lbl"><span id="pgTxt">0 / 10 trends entered</span><span id="pgPct">0%</span></div>
      <div class="pg-track"><div class="pg-fill" id="pgFill"></div></div>
    </div>

    <!-- nav buttons -->
    <div class="navrow">
      <button class="nbtn" id="nb1" onclick="goLogin();return false;">📱 Login</button>
      <button class="nbtn" id="nb2" onclick="goHome();return false;">🏠 Home</button>
      <button class="nbtn" id="nb3" onclick="goWingo();return false;">🎮 WinGo</button>
    </div>

    <!-- ENTRY PANEL -->
    <div id="entryPanel">
      <div class="ent-title" id="entTitle">Enter Trend #1</div>

      <!-- Number 0-9 -->
      <div class="gl">Number</div>
      <div class="ng" id="numGrid"></div>

      <!-- Colour -->
      <div class="gl">Colour</div>
      <div class="bg" id="colGroup">
        <button class="ob c-r" data-c="Red" onclick="pickColour(this);return false;">🔴 Red</button>
        <button class="ob c-g" data-c="Green" onclick="pickColour(this);return false;">🟢 Green</button>
        <button class="ob c-v" data-c="Violet" onclick="pickColour(this);return false;">🟣 Violet</button>
        <button class="ob c-rp" data-c="RedViolet" onclick="pickColour(this);return false;">🔴🟣 R+V</button>
        <button class="ob c-gp" data-c="GreenViolet" onclick="pickColour(this);return false;">🟢🟣 G+V</button>
      </div>

      <!-- Size -->
      <div class="gl">Size</div>
      <div class="bg" id="sizeGroup">
        <button class="ob s-big" data-s="Big" onclick="pickSize(this);return false;">📈 Big</button>
        <button class="ob s-sml" data-s="Small" onclick="pickSize(this);return false;">📉 Small</button>
      </div>

      <button class="bsave" id="btnSave" onclick="saveTrend();return false;">
        💾 Save Trend #<span id="saveLbl">1</span>
      </button>

      <!-- Saved list -->
      <div id="savedList"></div>
    </div>

    <!-- RESULT -->
    <div id="resultArea">
      <div class="rnext">🎯 Next Predicted Result</div>
      <div class="rnum" id="rNum">—</div>
      <div class="rrow">
        <span class="rbadge rb-pid" id="rPid">—</span>
      </div>
      <div class="rrow">
        <span class="rbadge" id="rCol">—</span>
        <span class="rbadge" id="rSz">—</span>
      </div>
      <div class="cconf">
        <div class="ccrow"><span class="cclbl">Confidence</span><span class="ccpct" id="rConf">—</span></div>
        <div class="ctrack"><div class="cfill" id="rFill"></div></div>
      </div>
      <button class="bagain" onclick="startOver();return false;">🔄 Enter New 10 Trends</button>
    </div>

  </div><!-- /body -->
</div><!-- /card -->

<script src="auto-fetch.js"></script>
</body>
</html>
